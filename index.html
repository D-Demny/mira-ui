<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800, height=480, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#121212" />
    <title>Mira</title>
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('/fonts/Inter-Medium.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #121212;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #121212;
      }
      #boot-splash .wordmark {
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 88px;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #ffffff;
      }
      #root:not(:empty) + #boot-splash {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash"><div class="wordmark">mira</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
